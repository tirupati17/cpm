# CPM install config — customize per project
# Copy to .cpm-install.conf (gitignored) and edit. Used by generate-report.sh
# to render install instructions in the INSTALL section of status reports.

# ── iOS (TestFlight) ─────────────────────────────────────────
INSTALL_IOS_VERSION="2.0.0"
INSTALL_IOS_BUNDLE_ID="com.example.yourapp"
INSTALL_IOS_STEPS="1. Install TestFlight from the App Store
2. Open TestFlight → find your app
3. Look for the latest build of version 2.0.0
4. Tap Install / Update
5. Open your app → sign in"

# ── Android (APK / Play internal track) ──────────────────────
INSTALL_ANDROID_CHANNEL="Play Console internal track"
INSTALL_ANDROID_BRANCH_KEYWORD="main"
INSTALL_ANDROID_STEPS="1. Open the Play Store internal-testing link (in #your-builds-channel)
2. Tap Install
3. Open your app → sign in"

# ── Web (Admin Panel + Landing) ──────────────────────────────
INSTALL_ADMIN_URL="https://admin.example.com"
INSTALL_LANDING_URL="https://example.com"

# ── Voice Agent (LiveKit Cloud) ──────────────────────────────
# Voice agent runs on LiveKit Cloud (ap-south region). No client install —
# triggered from inside the iOS app's coach screen.
